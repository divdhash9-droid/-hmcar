name: Deploy to VPS/Server

on:
  push:
    branches: [ main, production ]
  workflow_dispatch:
    inputs:
      server:
        description: 'Server to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-to-server:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      env:
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_PATH: ${{ secrets.SERVER_PATH }}
      run: |
        ssh $SERVER_USER@$SERVER_HOST << 'EOF'
          cd ${{ secrets.SERVER_PATH }}
          
          # Pull latest changes
          git fetch origin
          git reset --hard origin/main
          
          # Install dependencies
          npm ci --production
          
          # Run database migrations/optimizations
          npm run optimize:db || true
          
          # Restart application with PM2
          pm2 restart car-auction || pm2 start npm --name "car-auction" -- start
          
          # Save PM2 config
          pm2 save
          
          echo "✅ Deployment completed successfully!"
        EOF

    - name: Health check
      run: |
        sleep 10
        curl -f ${{ secrets.SERVER_URL }}/health || exit 1

    - name: Rollback on failure
      if: failure()
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          cd ${{ secrets.SERVER_PATH }}
          git reset --hard HEAD~1
          npm ci --production
          pm2 restart car-auction
        EOF

  deploy-with-docker:
    name: Deploy with Docker on Server
    runs-on: ubuntu-latest
    if: github.event.inputs.server == 'production' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy Docker containers
      env:
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_PATH: ${{ secrets.SERVER_PATH }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        ssh $SERVER_USER@$SERVER_HOST << 'EOF'
          cd ${{ secrets.SERVER_PATH }}
          
          # Pull latest Docker image
          docker pull ${{ secrets.DOCKER_USERNAME }}/car-auction:latest
          
          # Stop and remove old containers
          docker-compose down
          
          # Start new containers
          docker-compose up -d
          
          # Cleanup old images
          docker image prune -af --filter "until=24h"
          
          echo "✅ Docker deployment completed!"
        EOF

    - name: Verify deployment
      run: |
        sleep 15
        curl -f ${{ secrets.SERVER_URL }}/health || exit 1
        echo "✅ Health check passed!"

  notify:
    name: Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [deploy-to-server, deploy-with-docker]
    if: always()
    
    steps:
    - name: Send notification
      run: |
        STATUS="${{ needs.deploy-to-server.result == 'success' && needs.deploy-with-docker.result == 'success' && 'SUCCESS' || 'FAILED' }}"
        echo "Deployment Status: $STATUS"
        
        # Send to Slack (if configured)
        if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚀 Server Deployment $STATUS\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\"}"
        fi
