  <path d="M18 68 C46 36, 112 20, 176 26 C240 32, 292 68, 362 70 L372 70 L372 78 L18 78 Z" fill="none" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/>

  <!-- Text -->
