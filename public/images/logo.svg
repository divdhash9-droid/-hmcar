    <text x="0" y="0" font-family="Playfair Display, serif" font-weight="700" font-size="28" fill="#d4af37">HM</text>
    <text x="70" y="0" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#faf7f2">CAR</text>
  </g>
</svg>
